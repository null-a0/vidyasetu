services:
  - type: web
    name: vidyasetu-backend
    runtime: docker
    region: oregon
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vidyasetu-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: BASE_URL
        value: https://vidyasetu-backend.onrender.com
      - key: FRONTEND_ORIGINS
        value: https://vidyasetu-frontend.netlify.app,https://vidyasetu-backend.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_RATE_LIMIT_BACKEND
        value: "database"

databases:
  - name: vidyasetu-db
    databaseName: vidyasetu
    region: oregon
    plan: free
